[project]
name = "audiomatch"
version = "0.1.0"
description = "Compare two audio files to determine if one was derived from the other. Native support for WAVE and MP3 formats."
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.0",
    "miniaudio>=1.59",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.1.0",
    "requests>=2.31.0",
]

[project.scripts]
audiomatch = "audiomatch.main:audio_matcher"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
